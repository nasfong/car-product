<!DOCTYPE html>
<html>
<head>
  <title>QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</head>
<body>
  <div id="qrcode"></div>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://yourwebsite.com",
      width: 200,
      height: 200,
    });
  </script>
</body>
</html>
