name: Lighthouse Performance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: npm start > /tmp/server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✓ Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "✗ Server failed"
          cat /tmp/server.log
          exit 1

      - name: Run Lighthouse
        run: npm run lighthouse:ci

      - name: Comment results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const reports = JSON.parse(fs.readFileSync('./.lighthouseci/results.json', 'utf8'));
              const report = reports[0];
              const scores = report.categories;
              const comment = `## 📊 Lighthouse Report\n\n| Metric | Score |\n|--------|-------|\n| Performance | ${Math.round(scores.performance.score * 100)}/100 |\n| Accessibility | ${Math.round(scores.accessibility.score * 100)}/100 |\n| Best Practices | ${Math.round(scores['best-practices'].score * 100)}/100 |\n| SEO | ${Math.round(scores.seo.score * 100)}/100 |`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Report not found');
            }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: ./.lighthouseci/
          retention-days: 30
