name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1

  lighthouse:
    name: Lighthouse Performance Testing
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Start Next.js production server
        run: |
          npm start > /tmp/server.log 2>&1 &
          sleep 5
          echo "Server started"

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... attempt $i/30"
            sleep 1
          done
          echo "Server failed to start"
          cat /tmp/server.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouserc.json'
          temporaryPublicStorage: true
          runs: 3
          uploadArtifacts: true

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lighthouseReport = fs.existsSync('./.lighthouseci/results.json') 
              ? JSON.parse(fs.readFileSync('./.lighthouseci/results.json', 'utf8'))
              : null;
            
            if (!lighthouseReport || !lighthouseReport[0]) {
              console.log('No Lighthouse report found');
              return;
            }
            
            const report = lighthouseReport[0];
            const scores = {
              performance: Math.round((report.categories.performance?.score || 0) * 100),
              accessibility: Math.round((report.categories.accessibility?.score || 0) * 100),
              'best-practices': Math.round((report.categories['best-practices']?.score || 0) * 100),
              seo: Math.round((report.categories.seo?.score || 0) * 100),
            };
            
            const scoreColor = (score) => {
              if (score >= 90) return '🟢';
              if (score >= 75) return '🟡';
              return '🔴';
            };
            
            const comment = `## 🚀 Lighthouse Performance Report
            
| Category | Score |
|----------|-------|
| ${scoreColor(scores.performance)} Performance | ${scores.performance}/100 |
| ${scoreColor(scores.accessibility)} Accessibility | ${scores.accessibility}/100 |
| ${scoreColor(scores['best-practices'])} Best Practices | ${scores['best-practices']}/100 |
| ${scoreColor(scores.seo)} SEO | ${scores.seo}/100 |

[View detailed report](${report.reportUrl || 'https://storage.googleapis.com/lighthouse-infrastructure.appspot.com/'})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          make build TAG=${TAG_NAME}
          make push TAG=${TAG_NAME}
