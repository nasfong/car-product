
version: '3.8'

services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    container_name: car-product
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Use anonymous volume for node_modules to prevent overwriting
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true